<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mess Management</title>
<style>
:root{--bg:#f1f4f2;--sf:#fff;--tx:#14211a;--mu:#5b6a61;--ac:#0f4c3a;--on:#fff;--bd:#d6ded9;--rd:#b3402b;--gd:#b8902a;--gt:#7a5d0a;--tn:#e3eee8;--rdb:#f8e4df;--gdb:#f6ecd0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--sf:#18221d;--tx:#e8efe9;--mu:#92a398;--ac:#4cc38a;--on:#0c1a12;--bd:#2a372f;--rd:#ff8a73;--gd:#e0b84f;--gt:#e0b84f;--tn:#203029;--rdb:#3a2420;--gdb:#37301a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1512;--sf:#18221d;--tx:#e8efe9;--mu:#92a398;--ac:#4cc38a;--on:#0c1a12;--bd:#2a372f;--rd:#ff8a73;--gd:#e0b84f;--gt:#e0b84f;--tn:#203029;--rdb:#3a2420;--gdb:#37301a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:92px;font-variant-numeric:tabular-nums}
header{background:var(--ac);color:var(--on);padding:14px 16px 32px;border-bottom:4px solid var(--gd)}
.top{display:flex;gap:12px;align-items:center}
.cr{width:44px;height:44px;border-radius:12px;background:var(--on);color:var(--ac);display:flex;align-items:center;justify-content:center;flex:none}
.cr svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lg{width:56px;height:56px;border-radius:50%;flex:none;border:2px solid var(--gd);background:#fff;object-fit:cover}
.sc{font-size:11.5px;font-weight:600;line-height:1.3;opacity:.92}
h1{margin:2px 0 0;font-size:22px;font-weight:800;letter-spacing:.6px}
.bar{display:flex;align-items:center;gap:8px;margin:12px 0 8px;background:rgba(255,255,255,.12);border-radius:14px;padding:4px}
.nv{width:40px;height:40px;border:0;border-radius:10px;background:rgba(255,255,255,.16);color:var(--on);font-size:22px;line-height:1}
.mt{flex:1;text-align:center;font-weight:700;font-size:17px}
.hl{display:block;font-size:12px;font-weight:600;opacity:.95}
header input{display:block;width:100%;margin-top:3px;font:inherit;font-size:15px;padding:9px 12px;border-radius:10px;border:0;background:var(--on);color:var(--ac);font-weight:600}
#stc{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.16)}
main{padding:14px;max-width:560px;margin:0 auto}
.hero{display:grid;grid-template-columns:repeat(3,1fr);background:var(--ac);color:var(--on);border-radius:14px;padding:14px 6px;text-align:center;margin-bottom:10px}
.hero span{display:block;font-size:12px;opacity:.85}
.hero b{font-size:18px}
.pr{height:8px;border-radius:5px;background:var(--bd);overflow:hidden;margin-bottom:14px}
.pr i{display:block;height:100%;background:var(--ac)}
.mc{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:11px;margin-bottom:8px}
.r{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.r:last-child{margin-bottom:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--tn);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
input.nm,input.f,textarea{flex:1;min-width:0;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input.nm{font-weight:700;border-color:transparent;background:transparent;padding:6px 2px}
select.f{flex:1;min-width:0;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
.pb{padding:10px 14px;border-radius:10px;border:1.5px solid var(--ac);background:transparent;color:var(--ac);font-weight:700}
.pb.on{background:var(--ac);color:var(--on)}
.dl{width:42px;padding:8px 0;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--mu)}
.lb{font-size:13px;color:var(--mu);width:34px}
.ch{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--rdb);color:var(--rd);white-space:nowrap}
.ch.ok{background:var(--tn);color:var(--ac)}
.ch.pt{background:var(--gdb);color:var(--gt)}
.st{font-size:13px;color:var(--mu)}
.bt{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font-weight:700;text-align:center;text-decoration:none;margin:8px 0}
.bt.o{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.k{display:flex;justify-content:space-between;padding:12px 14px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;margin-bottom:6px}
.k.big{background:var(--ac);color:var(--on);border-color:var(--ac);font-size:19px;font-weight:800}
h2{margin:8px 0 6px;font-size:18px}
h3{margin:18px 0 8px;font-size:16px}
.sc2{font-size:12px;font-weight:700;color:var(--ac)}
.mu{color:var(--mu);font-size:14px}
.e{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.dy{display:flex;gap:10px;align-items:center}
.dy b{width:92px;flex:none}
.dy.today{border-color:var(--gd);box-shadow:inset 4px 0 0 var(--gd)}
.tb{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:6px}
.tb th,.tb td{border:1px solid var(--bd);padding:5px 6px;text-align:left}
.tb th{background:var(--tn)}
.ro .w{display:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:9px 0 8px;border:0;background:none;color:var(--mu);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.a{color:var(--ac)}
nav button.a svg{background:var(--tn);width:50px;height:30px;padding:4px 14px;border-radius:15px}
#bc{max-width:560px;margin:-16px auto 0;padding:0 14px;position:relative}
.bal{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(15,76,58,.16)}
.bal small{display:block;color:var(--mu);font-size:12px}
.bn{font-size:29px;font-weight:800;color:var(--ac);line-height:1.15}
.sd{text-align:right;font-size:14px}
.sd b{display:block;margin-bottom:2px}
.mc.sok{border-left:5px solid var(--ac)}
.mc.spt{border-left:5px solid var(--gd)}
.mc.sno{border-left:5px solid var(--rd)}
@media print{header,nav,#bc,.nop{display:none}body{background:#fff;color:#000;padding:0}.mc{border:0}}
.lgo{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
.lgc{width:100%;max-width:380px;text-align:center}
.lgc h2{margin:6px 0 4px}
.lgc input{width:100%;margin:6px 0;font:inherit;padding:13px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx)}
.lg2{width:96px;height:96px;border-radius:50%;border:3px solid var(--gd);background:#fff;object-fit:cover}
.lo{margin-left:8px;font-size:12px;font-weight:600;padding:3px 12px;border-radius:20px;border:0;background:rgba(255,255,255,.16);color:var(--on)}
</style>

<script src="firebase-config.js"></script>
</head>

<script>
const SCHOOL="GOVT ELEMENTARY SCHOOL CHAK NO 245 JB BHOWANA";
const DAYS=[['mon','Monday'],['tue','Tuesday'],['wed','Wednesday'],['thu','Thursday']];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rs=n=>'Rs. '+Math.round(n).toLocaleString('en-US');
const clone=x=>JSON.parse(JSON.stringify(x));
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const ymd=d=>ym(d)+'-'+String(d.getDate()).padStart(2,'0');
let S=init(),t=0,m=ym(new Date()),delId=0,msg='',db=null,RO=false,st='local',pend=null,tm=null;
function init(){let p=null;try{const r=localStorage.getItem('mess');if(r){p=JSON.parse(r);if(!(p&&p.members&&p.months))p=null}}catch(e){}
if(!p)p={fee:1000,nid:16,months:{},members:Array.from({length:15},(_,i)=>({id:i+1,name:'Member '+(i+1)}))};
Object.values(p.months).forEach(o=>{for(const k in o.paid){if(o.paid[k]===true)o.paid[k]=o.fee||p.fee;else if(!o.paid[k])o.paid[k]=0}});
if(!p.menu)p.menu={};return p}
function sv(all){try{localStorage.setItem('mess',JSON.stringify(S))}catch(e){}
if(!db||RO)return;pend=pend||{ms:{}};pend.cfg={fee:S.fee,nid:S.nid,members:S.members,menu:S.menu};
(all?Object.keys(S.months):[m]).forEach(k=>{if(S.months[k])pend.ms[k]=S.months[k]});clearTimeout(tm);tm=setTimeout(flush,400);setSt('wait')}
async function flush(){const p=pend;pend=null;if(!p)return;try{await db.doc('mess/config').set(clone(p.cfg));for(const k in p.ms)await db.doc('months/'+k).set(clone(p.ms[k]));setSt('ok')}catch(e){setSt('err')}}
function setSt(s){st=s;const x={local:'Sirf is phone mein',ok:'Online sync ho gaya',wait:'Save ho raha hai...',err:'Sync nahi hua, dobara koshish karein',ro:'Sirf dekh sakte hain',load:'Online data load ho raha hai...'};$('#stc').textContent=x[s]||''}
const SEED={"fee":1000,"nid":1,"members":[],"menu":{},"months":{}};
let unsub=[];
function showLogin(t){$('#lg').style.display='flex';$('#lm').textContent=t||'';$('#lgi').src=document.querySelector('header .lg').src}
async function login(){$('#lm').textContent='';try{await firebase.auth().signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value)}catch(x){$('#lm').textContent='Email ya password galat hai.'}}
function logout(){try{firebase.auth().signOut()}catch(e){}}
async function connect(){
 const FB=window.FIREBASE_CONFIG||{};
 if(!window.firebase||!FB.apiKey||/PASTE/.test(FB.apiKey)){showLogin('Firebase config abhi set nahi hui. Setup guide dekhein.');return}
 try{firebase.initializeApp(FB);db=firebase.firestore();try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
  firebase.auth().onAuthStateChanged(u=>{if(!u){unsub.forEach(f=>f());unsub=[];showLogin('');return}$('#lg').style.display='none';start()})
 }catch(e){showLogin('Connect nahi hua: '+e.message)}
}
function start(){setSt('load');unsub.forEach(f=>f());unsub=[];const er=()=>setSt('err');
 unsub.push(db.doc('mess/config').onSnapshot(s=>{
  if(s.exists){const c=clone(s.data());S.fee=c.fee;S.nid=c.nid;S.members=c.members||[];S.menu=c.menu||{};setSt('ok')}
  else if(!s.metadata.fromCache){Object.assign(S,clone(SEED));sv(true);setSt('ok')}
  render()},er));
 unsub.push(db.collection('months').onSnapshot(s=>{if(s.metadata.fromCache&&s.empty)return;S.months={};s.docs.forEach(d=>{S.months[d.id]=clone(d.data())});render()},er))}
const M=()=>S.months[m]||(S.months[m]={paid:{},exp:[],fee:S.fee});
const fe=o=>o.fee||S.fee;
const col=o=>Object.values(o.paid).reduce((a,b)=>a+(+b||0),0);
const ex=o=>o.exp.reduce((a,e)=>a+e.amt,0);
const due=(o,id)=>Math.max(fe(o)-(+o.paid[id]||0),0);
const totDue=o=>S.members.reduce((a,x)=>a+due(o,x.id),0);
function opening(){let b=0;Object.keys(S.months).sort().forEach(k=>{if(k<m){const o=S.months[k];b+=col(o)-ex(o)}});return b}
function sp(id,v){M().paid[id]=Math.max(parseFloat(v)||0,0);sv();render()}
function ren(id,v){const x=S.members.find(a=>a.id==id);if(x&&v.trim())x.name=v.trim();sv()}
function dm(id){if(delId==id){S.members=S.members.filter(a=>a.id!=id);delId=0;sv()}else delId=id;render()}
function am(){const n=$('#nn').value.trim();if(!n)return;S.members.push({id:S.nid++,name:n});sv();render()}
function ae(){const sel=$('#it').value,item=(sel=='__o'?$('#it2').value:sel).trim(),amt=parseFloat($('#am').value);if(!item||!(amt>0)){msg='Item aur sahi amount likhein.';render();return}
M().exp.push({d:$('#dt').value,item,amt});msg='';sv();render()}
function de(i){M().exp.splice(i,1);sv();render()}
function sm(k,v){S.menu[k]=v.trim();sv();$('#mm').textContent='Menu save ho gaya.'}
function setFee(v){const f=parseFloat(v);if(f>0){S.fee=f;M().fee=f;sv();render()}}
function shift(d){const [y,mo]=m.split('-').map(Number);m=ym(new Date(y,mo-1+d,1));delId=0;render()}
function stText(o){const op=opening(),c=col(o),e=ex(o),f=fe(o),L=[SCHOOL,'MESS STATEMENT - '+m,'Mess Manager: '+(o.mgr||'-'),'','COLLECTION ('+rs(f)+' har member)'];
S.members.forEach((x,i)=>L.push((i+1)+'. '+x.name+': Paid '+rs(+o.paid[x.id]||0)+(due(o,x.id)?', Baqi '+rs(due(o,x.id)):'')));
L.push('Kul collection: '+rs(c),'','KHARCHA');
o.exp.slice().sort((a,b)=>a.d.localeCompare(b.d)).forEach(x=>L.push(x.d+' '+x.item+': '+rs(x.amt)));
L.push('Kul kharcha: '+rs(e),'','Pichla bacha: '+rs(op),'Bacha hua: '+rs(op+c-e),'Kul baqi: '+rs(totDue(o)));
return L.join(String.fromCharCode(10))}
function cp(){const x=stText(M());const f=()=>{$('#cm').textContent='Copy nahi hua. WhatsApp button use karein.'};try{navigator.clipboard.writeText(x).then(()=>{$('#cm').textContent='Statement copy ho gaya.'}).catch(f)}catch(e){f()}}
function stView(o){const op=opening(),c=col(o),e=ex(o),f=fe(o);
const mr=S.members.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${rs(+o.paid[x.id]||0)}</td><td>${due(o,x.id)?rs(due(o,x.id)):'-'}</td></tr>`).join('');
const er=o.exp.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(x=>`<tr><td>${x.d.slice(8)+'/'+x.d.slice(5,7)}</td><td>${esc(x.item)}</td><td>${rs(x.amt)}</td></tr>`).join('')||'<tr><td colspan="3">Koi kharcha nahi</td></tr>';
return `<button class="pb nop" onclick="t=3;render()">Wapas</button><div class="mc" style="margin-top:10px"><div style="display:flex;gap:10px;align-items:center"><img class="lg" alt="" style="width:44px;height:44px" src="${$('.lg').src}"><div class="sc2">${SCHOOL}</div></div><h2>Mess Statement - ${m}</h2><div><b>Mess Manager:</b> ${esc(o.mgr||'-')}</div>
<h3>Collection (${rs(f)} har member)</h3><table class="tb"><tr><th>#</th><th>Naam</th><th>Paid</th><th>Baqi</th></tr>${mr}<tr><th></th><th>Total</th><th>${rs(c)}</th><th>${rs(totDue(o))}</th></tr></table>
<h3>Kharcha</h3><table class="tb"><tr><th>Date</th><th>Item</th><th>Amount</th></tr>${er}<tr><th></th><th>Total</th><th>${rs(e)}</th></tr></table>
<h3>Hisab</h3><div class="k"><span>Pichla bacha</span><b>${rs(op)}</b></div><div class="k"><span>Collection</span><b>${rs(c)}</b></div><div class="k"><span>Kharcha</span><b>${rs(e)}</b></div><div class="k big"><span>Bacha hua</span><span>${rs(op+c-e)}</span></div></div>
<a class="bt nop" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(stText(o))}">WhatsApp par statement bhejein</a><button class="bt o nop" onclick="cp()">Statement copy karein</button><button class="bt o nop" onclick="pdf()">PDF save karein</button><div class="mu nop" id="cm"></div>`}
async function pdf(){const o=M(),mm=$('#cm');
 try{
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J){mm.textContent='PDF tool load nahi hua. Internet check karein.';return}
  
  const op=opening(),c=col(o),e=ex(o);
  const d=new J({unit:'mm',format:'a4'});
  d.addImage($('.lg').src,'JPEG',14,10,22,22);
  d.setFont('helvetica','bold');d.setFontSize(11);d.text(SCHOOL,40,18);
  d.setFontSize(15);d.text('MESS STATEMENT - '+m,40,26);
  d.setFont('helvetica','normal');d.setFontSize(10);d.text('Mess Manager: '+(o.mgr||'-'),40,32);
  const hs={fillColor:[15,76,58],textColor:255},fs={fillColor:[227,238,232],textColor:20,fontStyle:'bold'};
  d.autoTable({startY:38,head:[['#','Naam','Paid','Remaining']],body:S.members.map((x,i)=>[i+1,x.name,rs(+o.paid[x.id]||0),due(o,x.id)?rs(due(o,x.id)):'-']),foot:[['','Total',rs(c),rs(totDue(o))]],headStyles:hs,footStyles:fs,styles:{fontSize:9,cellPadding:1.6}});
  d.autoTable({startY:d.lastAutoTable.finalY+7,head:[['Date','Item','Amount']],body:o.exp.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(x=>[x.d.slice(8)+'/'+x.d.slice(5,7),x.item,rs(x.amt)]).concat(o.exp.length?[]:[['-','Koi kharcha nahi','-']]),foot:[['','Total',rs(e)]],headStyles:hs,footStyles:fs,styles:{fontSize:9,cellPadding:1.6}});
  d.autoTable({startY:d.lastAutoTable.finalY+7,body:[['Pichla bacha',rs(op)],['Collection',rs(c)],['Kharcha',rs(e)],['Bacha hua',rs(op+c-e)]],theme:'plain',styles:{fontSize:11,fontStyle:'bold'},columnStyles:{1:{halign:'right'}},tableWidth:90});
  d.save('Mess-Statement-'+m+'.pdf');
  mm.textContent='PDF save ho gaya.';
 }catch(x){mm.textContent=(x&&x.code=='declined')?'Save cancel ho gaya.':'PDF nahi ban saka. Dobara koshish karein.'}
}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('a',b.dataset.t==(t==4?3:t)));
 const [yy,mm]=m.split('-').map(Number);$('#mt').textContent=new Date(yy,mm-1,1).toLocaleString('en-US',{month:'long',year:'numeric'});
 const o=M(),f=fe(o),v=$('#v');$('#mg').value=o.mgr||'';
 const bl=opening()+col(o)-ex(o);$('#bc').style.display=t>=3?'none':'';$('#bc').innerHTML=`<div class="bal"><div><small>Bacha hua (balance)</small><div class="bn">${rs(bl)}</div></div><div class="sd"><small>Collection</small><b style="color:var(--ac)">${rs(col(o))}</b><small>Kharcha</small><b style="color:var(--rd)">${rs(ex(o))}</b></div></div>`;
 document.body.classList.toggle('ro',RO);if(RO)setSt('ro');
 if(t==0){
  const c=col(o),d=totDue(o),n=S.members.filter(x=>due(o,x.id)==0).length,pc=Math.min(100,c/(f*S.members.length||1)*100);
  v.innerHTML=`<div class="hero"><div><span>Collection</span><b>${rs(c)}</b></div><div><span>Remaining</span><b>${rs(d)}</b></div><div><span>Complete</span><b>${n}/${S.members.length}</b></div></div><div class="pr"><i style="width:${pc}%"></i></div><div class="mu" style="margin:-8px 0 12px">${Math.round(pc)}% collection mukammal</div>`+
  S.members.map(x=>{const p=+o.paid[x.id]||0,r=due(o,x.id),cl=r==0?'ok':(p>0?'pt':''),lb=r==0?'Complete':(p>0?'Partial':'Remaining');return `<div class="mc s${cl||'no'}"><div class="r"><div class="av">${esc((x.name.trim()[0]||'?').toUpperCase())}</div><input class="nm w" value="${esc(x.name)}" onchange="ren(${x.id},this.value)" aria-label="Naam"><span class="ch ${cl}">${lb}</span><button class="dl w" onclick="dm(${x.id})">${delId==x.id?'Pakka?':'&times;'}</button></div><div class="r"><span class="lb">Paid</span><input class="f w" type="number" inputmode="decimal" value="${p||''}" placeholder="0" onchange="sp(${x.id},this.value)"><button class="pb w ${r==0?'on':''}" onclick="sp(${x.id},${r==0?0:f})">Complete</button></div><div class="st">${r?'Remaining '+rs(r):'Poori raqam ada ho gayi'}</div></div>`}).join('')+
  `<div class="w"><h3>Naya member</h3><div class="r"><input class="f" id="nn" placeholder="Naam"><button class="pb on" onclick="am()">Add</button></div></div>`;
 }else if(t==1){
  const td=ymd(new Date()),d=td.startsWith(m)?td:m+'-01';
  v.innerHTML=`<div class="hero" style="grid-template-columns:1fr"><div><span>Is mahine ka kharcha</span><b>${rs(ex(o))}</b></div></div>
  <div class="w"><div class="r"><input class="f" type="date" id="dt" value="${d}"></div>
  <div class="r"><select class="f" id="it" aria-label="Item" onchange="$('#it2').style.display=this.value=='__o'?'block':'none'"><option>Samosa</option><option>Cold Drink</option><option>Tea</option><option>Fruits</option><option>Biscuits</option><option>Baryani</option><option value="__o">Other (khud likhein)</option></select></div><div class="r"><input class="f" id="it2" placeholder="Item ka naam" style="display:none"></div>
  <div class="r"><input class="f" id="am" type="number" inputmode="decimal" placeholder="Amount (Rs.)"></div>
  <button class="bt" onclick="ae()">Kharcha save karein</button>
  <div class="mu">${esc(msg)}</div></div>`+
  (o.exp.length?o.exp.map((e,i)=>[e,i]).sort((a,b)=>b[0].d.localeCompare(a[0].d)).map(([e,i])=>`<div class="e"><div><b>${esc(e.item)}</b><div class="mu">${e.d}</div></div><div><b>${rs(e.amt)}</b> <button class="dl w" style="width:40px;padding:6px 0;margin-left:6px" onclick="de(${i})">&times;</button></div></div>`).join(''):`<p class="mu">Abhi koi kharcha nahi.</p>`);
 }else if(t==2){
  const tk=(DAYS[new Date().getDay()-1]||[])[0];
  v.innerHTML=`<div class="mu" style="margin-bottom:10px">Mess Monday se Thursday tak chalta hai. Har din ka menu likhein.</div>`+
  DAYS.map(([k,n])=>`<div class="mc dy ${k==tk?'today':''}"><b>${n}</b><input class="f w" value="${esc(S.menu[k]||'')}" placeholder="Menu likhein" onchange="sm('${k}',this.value)" aria-label="${n} menu"></div>`).join('')+`<div class="mu" id="mm"></div>`;
 }else if(t==4){v.innerHTML=stView(o)
 }else{
  const op=opening(),c=col(o),e=ex(o),bal=op+c-e,d=totDue(o);
  const late=S.members.filter(x=>due(o,x.id)>0).map(x=>`${x.name} (${rs(due(o,x.id))})`);
  v.innerHTML=`<div class="k"><span>Mess Manager</span><b>${esc(o.mgr||'-')}</b></div>
  <div class="k"><span>Pichle mahine ka bacha</span><b>${rs(op)}</b></div>
  <div class="k"><span>Is mahine collection</span><b>${rs(c)}</b></div>
  <div class="k"><span>Is mahine kharcha</span><b>${rs(e)}</b></div>
  <div class="k big"><span>Bacha hua</span><span>${rs(bal)}</span></div>
  <div class="k" style="margin-top:6px"><span>Kul baqi wasooli</span><b style="color:var(--rd)">${rs(d)}</b></div>
  <h3>Baqi members (${late.length})</h3><div class="mu">${late.length?esc(late.join(', ')):'Sab ne collection de di.'}</div>
  <button class="bt" onclick="t=4;render();window.scrollTo(0,0)">Statement banayein aur share karein</button>
  <div class="w"><h3>Monthly collection (har member)</h3>
  <div class="r"><input class="f" type="number" inputmode="decimal" value="${f}" onchange="setFee(this.value)"></div></div>`;
 }
 if(RO)document.querySelectorAll('.w input').forEach(i=>i.readOnly=true),$('#mg').readOnly=true;
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{t=+b.dataset.t;msg='';delId=0;render();window.scrollTo(0,0)});
$('#pv').onclick=()=>shift(-1);$('#nx').onclick=()=>shift(1);
$('#mg').onchange=e=>{M().mgr=e.target.value.trim();sv()};
setSt('load');render();connect();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
